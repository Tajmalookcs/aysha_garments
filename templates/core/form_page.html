{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="page-head">
  <div><h2>{{ title }}</h2>{% if intro %}<p class="sub">{{ intro }}</p>{% endif %}</div>
</header>
<form method="post" class="app-form" novalidate>
  {% csrf_token %}
  {% include "core/_fields.html" %}
  <button class="btn btn-thread" type="submit">{{ save_label }}</button>
  {% if back %}<a class="btn btn-link" href="{% url back %}">Cancel</a>{% endif %}
</form>
{% endblock %}
