{% extends "base.html" %}
{% block title %}Invoices{% endblock %}
{% block content %}
<header class="page-head">
  <div><h2>Invoices</h2></div>
  <a class="btn btn-thread" href="{% url 'invoice_new' %}"><i class="bi bi-plus-lg"></i> New invoice</a>
</header>
<form method="get" class="row g-2 mb-3">
  <div class="col-md-5"><label class="visually-hidden" for="q">Search</label><input id="q" class="form-control" name="q" value="{{ q }}" placeholder="Invoice number or buyer"></div>
  <div class="col-md-4"><label class="visually-hidden" for="status">FBR status</label>
    <select id="status" class="form-select" name="status"><option value="">All statuses</option>
      {% for value, label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></div>
  <div class="col-md-3"><button class="btn btn-thread w-100" type="submit">Search</button></div>
</form>
{% if invoices %}{% include "billing/_table.html" %}
{% else %}<div class="empty"><p class="mb-0">No invoices match. Try a different search, or make a new invoice.</p></div>{% endif %}
{% endblock %}
